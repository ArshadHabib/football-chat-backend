name: Deploy Football Chat Backend

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e  # Exit immediately if any command fails

            echo "🔄 Starting deployment..."
            cd /var/www/football-chat-backend

            echo "Fetching latest code..."
            git fetch origin master
            # Get list of changed files before applying the pull
            CHANGED_FILES=$(git diff --name-only HEAD origin/master)

            echo "Changed files:"
            echo "$CHANGED_FILES"

            echo "Updating local repository..."
            git reset --hard
            git pull origin master

            # Check if package.json changed
            if echo "$CHANGED_FILES" | grep -q 'package.json'; then
              echo "📦 Detected package.json change - running npm install..."
              npm install
            else
              echo "✅ No package.json changes - skipping npm install"
            fi

            # Check if any file outside 'files/' directory changed
            if echo "$CHANGED_FILES" | grep -qv '^files/'; then
              echo "🚀 Changes detected outside 'files/' folder - restarting server..."
              pm2 reload chat-backend
            else
              echo "🟢 Only changes in 'files/' folder - skipping server restart"
            fi

            echo "✅ Deployment completed successfully!"
